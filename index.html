<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ストップウォッチ</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ストップウォッチ">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<style>
  :root {
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #000;
    color: #fff;
    font-family: -apple-system, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
    overscroll-behavior: none;
    user-select: none;
    -webkit-user-select: none;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    min-height: 100vh;
    min-height: 100dvh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  .time-display {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
  }

  #time {
    font-variant-numeric: tabular-nums;
    font-size: 17vw;
    font-weight: 200;
    letter-spacing: -2px;
    line-height: 1;
    text-align: center;
    transition: opacity 0.08s ease-out;
  }

  #time .ms {
    font-size: 0.5em;
    color: #8e8e93;
  }

  .controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    max-width: 420px;
    padding: 24px 20px 10px;
  }

  .btn {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    border: 1px solid #3a3a3c;
    font-size: 13px;
    font-weight: 500;
    white-space: nowrap;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #1c1c1e;
    color: #fff;
    -webkit-appearance: none;
    appearance: none;
    outline: none;
    transition: transform 0.08s ease-out, opacity 0.08s ease-out;
  }

  .btn.pressed {
    opacity: 0.6;
    transform: scale(0.93);
  }

  .btn.start {
    background: rgba(48, 209, 88, 0.16);
    color: #30d158;
  }

  .btn.stop {
    background: rgba(255, 69, 58, 0.16);
    color: #ff453a;
  }

  .btn.reset {
    background: #1c1c1e;
    color: #fff;
  }

  .btn:disabled {
    color: #48484a;
  }

  .btn.start:disabled,
  .btn.stop:disabled {
    opacity: 0.35;
  }

  .wake-indicator {
    position: fixed;
    top: max(10px, env(safe-area-inset-top));
    right: max(14px, env(safe-area-inset-right));
    font-size: 11px;
    color: #48484a;
    letter-spacing: 0.02em;
  }

  .wake-indicator.active {
    color: #30d158;
  }

  body.pressed #time {
    opacity: 0.4;
  }
</style>
</head>
<body>

  <div class="wake-indicator" id="wakeIndicator"></div>

  <div class="time-display">
    <div id="time">00:00<span class="ms">.00</span></div>
  </div>

  <div class="controls">
    <button class="btn reset" id="resetBtn" disabled>リセット</button>
    <button class="btn stop" id="stopBtn" disabled>停止</button>
    <button class="btn start" id="startBtn">開始</button>
  </div>

<script>
(function () {
  var timeEl = document.getElementById('time');
  var startBtn = document.getElementById('startBtn');
  var stopBtn = document.getElementById('stopBtn');
  var resetBtn = document.getElementById('resetBtn');
  var wakeIndicator = document.getElementById('wakeIndicator');

  var running = false;
  var startTimestamp = 0;
  var elapsedBeforeStart = 0;
  var rafId = null;

  function formatTime(ms) {
    var totalCentis = Math.floor(ms / 10);
    var centis = totalCentis % 100;
    var totalSeconds = Math.floor(totalCentis / 100);
    var seconds = totalSeconds % 60;
    var totalMinutes = Math.floor(totalSeconds / 60);
    var minutes = totalMinutes % 60;
    var hours = Math.floor(totalMinutes / 60);

    var pad2 = function (n) { return (n < 10 ? '0' : '') + n; };

    var main = hours > 0
      ? pad2(hours) + ':' + pad2(minutes) + ':' + pad2(seconds)
      : pad2(minutes) + ':' + pad2(seconds);

    return { main: main, centis: pad2(centis) };
  }

  function currentElapsed() {
    if (!running) return elapsedBeforeStart;
    return elapsedBeforeStart + (Date.now() - startTimestamp);
  }

  function render() {
    var elapsed = currentElapsed();
    var f = formatTime(elapsed);
    timeEl.innerHTML = f.main + '<span class="ms">.' + f.centis + '</span>';
  }

  function tick() {
    render();
    if (running) {
      rafId = requestAnimationFrame(tick);
    }
  }

  function start() {
    if (running) return;
    running = true;
    startTimestamp = Date.now();

    startBtn.disabled = true;
    stopBtn.disabled = false;
    resetBtn.disabled = true;

    rafId = requestAnimationFrame(tick);
  }

  function stop() {
    if (!running) return;
    var elapsed = currentElapsed();
    running = false;
    elapsedBeforeStart = elapsed;
    if (rafId) cancelAnimationFrame(rafId);
    render();

    startBtn.disabled = true;
    stopBtn.disabled = true;
    resetBtn.disabled = false;
  }

  function reset() {
    if (running) return;
    elapsedBeforeStart = 0;
    if (rafId) cancelAnimationFrame(rafId);
    render();

    startBtn.disabled = false;
    stopBtn.disabled = true;
    resetBtn.disabled = true;
  }

  // Restarts the count from zero without stopping the clock (button/wake
  // lock state is untouched since running never changes).
  function restart() {
    if (!running) return;
    elapsedBeforeStart = 0;
    startTimestamp = Date.now();
  }

  // Fires the action only at the moment the finger/pointer is lifted,
  // and only if it's still released inside the element (iOS "touch up inside").
  // stopPropagation keeps taps on the control buttons from also reaching the
  // full-screen tap handler bound on <body>.
  function bindPressRelease(el, action, isDisabled) {
    isDisabled = isDisabled || function () { return el.disabled === true; };
    var pressing = false;
    var suppressClick = false;

    el.addEventListener('pointerdown', function (e) {
      e.stopPropagation();
      if (isDisabled()) return;
      pressing = true;
      el.classList.add('pressed');
    });

    function release(e, insideOverride) {
      e.stopPropagation();
      if (!pressing) return;
      pressing = false;
      el.classList.remove('pressed');

      var inside = insideOverride;
      if (inside === undefined) {
        var rect = el.getBoundingClientRect();
        inside = e.clientX >= rect.left && e.clientX <= rect.right &&
                 e.clientY >= rect.top && e.clientY <= rect.bottom;
      }

      if (inside && !isDisabled()) {
        suppressClick = true;
        action();
      }
    }

    el.addEventListener('pointerup', function (e) { release(e); });
    el.addEventListener('pointercancel', function (e) { release(e, false); });

    // Keyboard / assistive-tech activation still uses the native click event.
    el.addEventListener('click', function (e) {
      e.stopPropagation();
      if (suppressClick) { suppressClick = false; return; }
      if (!isDisabled()) action();
    });
  }

  bindPressRelease(startBtn, start);
  bindPressRelease(stopBtn, stop);
  bindPressRelease(resetBtn, reset);

  // The whole screen doubles as a big Start/Reset/Restart target: Start
  // while idle, Reset once a time is frozen, or restart from zero without
  // stopping if the clock is already running. Stop always requires the
  // dedicated button, so a stray tap during the show can't halt the clock.
  bindPressRelease(document.body, function () {
    if (running) {
      restart();
    } else if (elapsedBeforeStart === 0) {
      start();
    } else {
      reset();
    }
  });

  document.addEventListener('touchmove', function (e) {
    e.preventDefault();
  }, { passive: false });

  // Keep the screen from auto-locking during a show (requires iOS 16.4+ Safari).
  var wakeLock = null;

  function requestWakeLock() {
    if (!('wakeLock' in navigator)) {
      wakeIndicator.textContent = '';
      return;
    }
    navigator.wakeLock.request('screen').then(function (lock) {
      wakeLock = lock;
      wakeIndicator.textContent = 'スリープ防止 ON';
      wakeIndicator.classList.add('active');
      wakeLock.addEventListener('release', function () {
        wakeIndicator.classList.remove('active');
        wakeIndicator.textContent = 'スリープ防止 OFF';
      });
    }).catch(function () {
      wakeIndicator.textContent = '';
    });
  }

  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') {
      requestWakeLock();
    }
  });

  requestWakeLock();
  render();
})();
</script>
</body>
</html>
